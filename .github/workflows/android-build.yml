name: Android build

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/build.gradle.kts

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_DEBUG_JSON: ${{ secrets.GOOGLE_SERVICES_DEBUG_JSON }}
          GOOGLE_SERVICES_RELEASE_JSON: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_DEBUG_JSON" || { echo "Repository secret GOOGLE_SERVICES_DEBUG_JSON is required." >&2; exit 1; }
          test -n "$GOOGLE_SERVICES_RELEASE_JSON" || { echo "Repository secret GOOGLE_SERVICES_RELEASE_JSON is required." >&2; exit 1; }
          mkdir -p app/src/debug app/src/release
          printf '%s' "$GOOGLE_SERVICES_DEBUG_JSON" > app/src/debug/google-services.json
          printf '%s' "$GOOGLE_SERVICES_RELEASE_JSON" > app/src/release/google-services.json

      - name: Test, lint, and build
        run: >-
          ./gradlew
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          lintDebug
          lintRelease
          assembleDebug
          assembleRelease
          bundleRelease
          --no-daemon
          --stacktrace

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-unsigned-${{ github.run_number }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-release.html
