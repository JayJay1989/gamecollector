services:
  gamecollector-api:
    image: ${GAMECOLLECTOR_API_IMAGE:-dockerhub.buildserver.be/gamecollector-api:sha-c4c6ac040eddd8728532d53116dc2ec0d56e9663}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Authentication__Keycloak__Audience: ${KEYCLOAK_AUDIENCE}
      Authentication__Keycloak__AdminRole: ${KEYCLOAK_ADMIN_ROLE:-gamecollector-admin}
      ConnectionStrings__GameCollector: "Data Source=/data/gamecollector.db;Foreign Keys=True;Default Timeout=5;Pooling=True"
      MediaStorage__Endpoint: minio:9000
      MediaStorage__AccessKey: ${MINIO_ACCESS_KEY}
      MediaStorage__SecretKey: ${MINIO_SECRET_KEY}
      MediaStorage__Bucket: ${MINIO_BUCKET:-gamecollector-media}
      MediaStorage__UseSsl: "false"
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Firebase__CredentialsPath: ${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase/firebase-service-account.json}
      ExternalCatalog__BaseUrl: ${EXTERNAL_CATALOG_BASE_URL:-https://api.upcitemdb.com/prod/trial/}
      ExternalCatalog__TimeoutSeconds: ${EXTERNAL_CATALOG_TIMEOUT_SECONDS:-5}
      ExternalCatalog__CacheMinutes: ${EXTERNAL_CATALOG_CACHE_MINUTES:-60}
      ApiHardening__MaximumRequestBodyBytes: ${API_MAX_REQUEST_BYTES:-1048576}
      ApiHardening__RateLimitPermitCount: ${API_RATE_LIMIT_PER_MINUTE:-120}
      ApiHardening__RateLimitWindowSeconds: "60"
      ApiHardening__RequestTimeoutSeconds: ${API_REQUEST_TIMEOUT_SECONDS:-30}
    volumes:
      - /volume1/docker/gamecollector/gamecollector-api:/data
      - ${FIREBASE_CREDENTIALS_HOST_DIRECTORY:-/volume1/docker/gamecollector/gamecollector-api/firebase}:/run/secrets/firebase:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    image: ${MINIO_IMAGE:?Set an explicit MinIO release image}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - /volume1/docker/gamecollector/minio:/data
    ports:
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
